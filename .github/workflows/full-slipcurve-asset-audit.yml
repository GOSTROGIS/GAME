name: Full Slipcurve asset audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: full-slipcurve-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-lfs-bridge:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out complete LFS catalog
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/worldgen/requirements-core.txt
            tools/worldgen/requirements-gis.txt

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build pinned GIS environment
        env:
          SABLE_REACH_BOOTSTRAP_PYTHON: python
        run: pnpm worldgen:setup

      - name: Verify LFS object integrity
        run: git lfs fsck

      - name: Validate complete LFS catalog, runtime packs, browser cycling, and legacy gates
        run: pnpm test:all
