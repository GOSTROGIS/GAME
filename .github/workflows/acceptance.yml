name: Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source without complete bridge LFS
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch non-bridge assets and representative bridge seeds
        run: git lfs pull --exclude="assets/3d/runtime/bridge/**"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/worldgen/requirements-core.txt
            tools/worldgen/requirements-gis.txt

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pinned GIS environment
        env:
          SABLE_REACH_BOOTSTRAP_PYTHON: python
        run: pnpm worldgen:setup

      - name: Verify Chrome runtime
        shell: pwsh
        run: |
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) { throw "Chrome not found at $chrome" }

      - name: Run pull-request acceptance and representative bridge audit
        env:
          BROWSER_NETWORK_EVIDENCE: "1"
        run: pnpm test:ci

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-network/**
          if-no-files-found: error
          retention-days: 14
