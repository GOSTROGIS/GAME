name: Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RASTER_ART_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Check out source without automatic LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Fetch repaired historical and changed concept-art LFS payloads
        shell: pwsh
        run: |
          git lfs fsck --pointers HEAD
          if ($LASTEXITCODE -ne 0) { throw "Git LFS pointer verification failed" }

          git lfs pull --include="assets/3d/runtime/bridge/**,assets/3d/seeds/slipcurve/**,tools/worldgen/generated/source/**" --exclude=""
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the repaired historical LFS payloads" }
          $base = $env:RASTER_ART_BASE_SHA
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') { $base = 'HEAD^' }
          $changed = git diff --name-only --diff-filter=ACMR "$base...HEAD" -- assets/characters assets/bestiary |
            Where-Object { $_ -match '\.png$' }
          foreach ($asset in $changed) {
            git lfs pull --include="$asset" --exclude=""
            if ($LASTEXITCODE -ne 0) { throw "Unable to fetch changed LFS payload: $asset" }
          }

          $lfsPaths = @(git lfs ls-files --name-only)
          if ($LASTEXITCODE -ne 0) { throw "Unable to enumerate Git LFS paths" }
          $historical = @($lfsPaths | Where-Object {
            $_ -like 'assets/3d/runtime/bridge/*' -or
            $_ -like 'assets/3d/seeds/slipcurve/*' -or
            $_ -like 'tools/worldgen/generated/source/*'
          })
          $changedLfs = @($changed | Where-Object { $lfsPaths -contains $_ })
          $required = @($historical + $changedLfs | Sort-Object -Unique)

          foreach ($asset in $required) {
            $pointer = (git cat-file -p "HEAD:$asset") -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "Unable to read LFS pointer: $asset" }
            $oidMatch = [regex]::Match($pointer, '(?m)^oid sha256:([0-9a-f]{64})$')
            $sizeMatch = [regex]::Match($pointer, '(?m)^size ([0-9]+)$')
            if (-not $oidMatch.Success -or -not $sizeMatch.Success) {
              throw "Malformed LFS pointer: $asset"
            }
            $payload = Get-Item -LiteralPath $asset -ErrorAction Stop
            $expectedSize = [int64]$sizeMatch.Groups[1].Value
            if ($payload.Length -ne $expectedSize) {
              throw "LFS payload size mismatch: $asset"
            }
            $actualOid = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualOid -ne $oidMatch.Groups[1].Value) {
              throw "LFS payload hash mismatch: $asset"
            }
          }
          Write-Output "Verified $($required.Count) hydrated LFS payloads against canonical pointers"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/worldgen/requirements-core.txt
            tools/worldgen/requirements-gis.txt

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pinned GIS environment
        env:
          SABLE_REACH_BOOTSTRAP_PYTHON: python
        run: pnpm worldgen:setup

      - name: Verify Chrome runtime
        shell: pwsh
        run: |
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) { throw "Chrome not found at $chrome" }

      - name: Run pull-request acceptance and representative bridge audit
        env:
          BROWSER_NETWORK_EVIDENCE: "1"
        run: pnpm test:ci

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-network/**
          if-no-files-found: error
          retention-days: 14
