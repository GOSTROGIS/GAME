<!-- @dsCard group="Type" viewport="700x170" subtitle="Letter-spacing is load-bearing here" name="Tracking scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div style="display:grid;gap:9px">
<p style="margin:0;color:var(--bone);font:500 12px var(--display);letter-spacing:-.05em">--track-title &nbsp;&minus;.05em &nbsp; Hollow March</p>
<p style="margin:0;color:var(--bone);font:500 12px var(--display);letter-spacing:.04em">--track-card &nbsp;.04em &nbsp; Gloamfarer</p>
<p style="margin:0;color:var(--bone);font:500 12px var(--display);letter-spacing:.12em">--track-button &nbsp;.12em &nbsp; BEGIN</p>
<p style="margin:0;color:var(--bone);font:500 12px var(--display);letter-spacing:.22em">--track-label &nbsp;.22em &nbsp; ORIGIN</p>
<p style="margin:0;color:var(--bone);font:500 12px var(--display);letter-spacing:.28em">--track-eyebrow &nbsp;.28em &nbsp; LEDGER</p></div>
</body>
</html>
