<!-- @dsCard group="Type" viewport="700x190" subtitle="The tracked small caps that define the system" name="Cinzel — labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<p style="margin:0 0 10px;color:var(--gold);font:var(--type-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase">Eyebrow &middot; 11px &middot; .28em</p>
<p style="margin:0 0 10px;color:var(--gold);font:var(--type-field-label);letter-spacing:var(--track-label);text-transform:uppercase">Field label &middot; 10px &middot; .22em</p>
<p style="margin:0 0 10px;color:var(--gold);font:var(--type-micro);letter-spacing:var(--track-micro);text-transform:uppercase">Micro meta &middot; 8px &middot; .2em</p>
<p style="margin:0 0 12px;color:var(--gold);font:var(--type-nano);letter-spacing:var(--track-nano);text-transform:uppercase">Nano &middot; 7px &middot; .15em</p>
<p style="margin:0;color:var(--muted);font:12px/1.5 var(--serif)">Legible only because they are short, uppercase and high-contrast. Three words maximum; never for copy a player must read to proceed.</p>
</body>
</html>
