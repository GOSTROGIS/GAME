<!-- @dsCard group="Colors" viewport="700x180" subtitle="Six meanings — gold, ember, blood, moss, cold light" name="Signals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"><div><div style="height:52px;background:var(--gold);border:1px solid var(--line)"></div>
<p style="margin:7px 0 2px;font:500 11px var(--display);letter-spacing:.05em">--gold</p>
<p style="margin:0;color:var(--muted);font:10px ui-monospace,Menlo,monospace">#b99552</p>
<p style="margin:3px 0 0;color:#797f7a;font:10px var(--sans)">Label, accent</p></div><div><div style="height:52px;background:var(--gold-bright);border:1px solid var(--line)"></div>
<p style="margin:7px 0 2px;font:500 11px var(--display);letter-spacing:.05em">--gold-bright</p>
<p style="margin:0;color:var(--muted);font:10px ui-monospace,Menlo,monospace">#e4c77e</p>
<p style="margin:3px 0 0;color:#797f7a;font:10px var(--sans)">Hover, focus</p></div><div><div style="height:52px;background:var(--ember);border:1px solid var(--line)"></div>
<p style="margin:7px 0 2px;font:500 11px var(--display);letter-spacing:.05em">--ember</p>
<p style="margin:0;color:var(--muted);font:10px ui-monospace,Menlo,monospace">#bd6135</p>
<p style="margin:3px 0 0;color:#797f7a;font:10px var(--sans)">Hazard, forge</p></div><div><div style="height:52px;background:var(--blood);border:1px solid var(--line)"></div>
<p style="margin:7px 0 2px;font:500 11px var(--display);letter-spacing:.05em">--blood</p>
<p style="margin:0;color:var(--muted);font:10px ui-monospace,Menlo,monospace">#6e2525</p>
<p style="margin:3px 0 0;color:#797f7a;font:10px var(--sans)">Harm, loss</p></div><div><div style="height:52px;background:var(--moss);border:1px solid var(--line)"></div>
<p style="margin:7px 0 2px;font:500 11px var(--display);letter-spacing:.05em">--moss</p>
<p style="margin:0;color:var(--muted);font:10px ui-monospace,Menlo,monospace">#52665c</p>
<p style="margin:3px 0 0;color:#797f7a;font:10px var(--sans)">Growth, done</p></div><div><div style="height:52px;background:var(--focus);border:1px solid var(--line)"></div>
<p style="margin:7px 0 2px;font:500 11px var(--display);letter-spacing:.05em">--focus</p>
<p style="margin:0;color:var(--muted);font:10px ui-monospace,Menlo,monospace">#658e9e</p>
<p style="margin:3px 0 0;color:#797f7a;font:10px var(--sans)">Mind, cold</p></div></div>
</body>
</html>
