<!-- @dsCard group="Colors" viewport="700x180" subtitle="Translucent tokens, shown over a keyframe" name="Membranes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div class="grid2">
<div><div style="height:58px;background-image:linear-gradient(var(--line),var(--line)),url('../../assets/world/dunmire-causeway.png');background-size:cover;background-position:center;border:1px solid var(--line)"></div>
<p style="margin:7px 0 2px;font:500 11px var(--display)">--line</p><p style="margin:0;color:var(--muted);font:10px ui-monospace,Menlo,monospace">rgba(216,208,189,.18)</p>
<p style="margin:3px 0 0;color:#797f7a;font:10px var(--sans)">Every border in the system</p></div>
<div><div style="height:58px;background-image:linear-gradient(var(--panel),var(--panel)),url('../../assets/world/dunmire-causeway.png');background-size:cover;background-position:center;border:1px solid var(--line)"></div>
<p style="margin:7px 0 2px;font:500 11px var(--display)">--panel</p><p style="margin:0;color:var(--muted);font:10px ui-monospace,Menlo,monospace">rgba(10,14,16,.9)</p>
<p style="margin:3px 0 0;color:#797f7a;font:10px var(--sans)">World stays faintly present</p></div></div>
</body>
</html>
