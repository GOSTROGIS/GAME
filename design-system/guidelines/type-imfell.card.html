<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<p style="margin:0;color:var(--bone-dim);font:var(--type-deck)">The bells are rung to keep the names, not the hours.</p>
<p style="margin:14px 0 0;max-width:560px;color:#bec0b8;font:var(--type-dialogue)">You came along the causeway, then. Few do, now the water has taken the low road and the parish with it.</p>
<p style="margin:12px 0 0;color:#9fa59f;font:var(--type-body-sm)">Card body &mdash; 13px/1.4. Hollow cheeks, exhausted eyes, corroded tools.</p>
<p style="margin:10px 0 0;color:var(--muted);font:var(--type-caption)">Caption &mdash; italic 15px</p>
</body>
</html>
