<!-- @dsCard group="Spacing" viewport="700x150" subtitle="44px minimum — and the deliberate exceptions" name="Touch floor" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div class="row">
<button style="min-height:var(--touch-min);padding:0 20px;background:var(--gold-btn-bg);color:var(--gold-btn-ink);border:1px solid var(--gold-btn-edge);font:var(--type-button);letter-spacing:var(--track-button);text-transform:uppercase">44px &mdash; compliant</button>
<div style="width:34px;height:34px;border-radius:50%;background:#6b5847;box-shadow:0 0 0 1px #4b4e4a"></div>
<div style="width:28px;height:28px;border:1px solid var(--line);background:#101517"></div>
<p style="margin:0;max-width:290px;color:var(--muted);font:12px/1.5 var(--serif)">Swatch (34px) and stepper (28px) sit below the floor. Dense desktop only &mdash; never the sole control on a touch surface.</p></div>
</body>
</html>
