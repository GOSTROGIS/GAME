<!-- @dsCard group="Type" viewport="700x200" subtitle="Interface voice at heading sizes" name="Cinzel — display" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<p style="margin:0;color:var(--bone-bright);font:500 46px/.84 var(--display);letter-spacing:var(--track-title)">Hollow Abbey</p>
<p style="margin:14px 0 0;color:var(--bone);font:var(--type-h2-modal)">Forge a Pilgrim &mdash; 27px</p>
<p style="margin:8px 0 0;color:var(--bone);font:var(--type-h2-panel)">Disciplines &mdash; 24px</p>
<p style="margin:8px 0 0;color:var(--bone);font:var(--type-h3-card)">Bell-Warden of the Drowned Parish &mdash; 13px</p>
</body>
</html>
