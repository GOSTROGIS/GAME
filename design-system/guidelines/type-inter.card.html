<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div class="row">
<kbd style="min-width:32px;padding:4px 7px;text-align:center;color:var(--gold-bright);background:var(--kbd-bg);border:1px solid var(--kbd-edge);border-radius:var(--radius-kbd);box-shadow:var(--shadow-kbd);font:var(--type-kbd)">W</kbd>
<kbd style="min-width:32px;padding:4px 7px;text-align:center;color:var(--gold-bright);background:var(--kbd-bg);border:1px solid var(--kbd-edge);border-radius:var(--radius-kbd);box-shadow:var(--shadow-kbd);font:var(--type-kbd)">Esc</kbd>
<span style="color:var(--muted);font:12px var(--sans);text-transform:uppercase;letter-spacing:.08em">13,034,431 XP at 99</span>
<span style="color:var(--muted);font:12px var(--sans);text-transform:uppercase;letter-spacing:.08em">30 Hz &middot; 50 clients</span></div>
<p style="margin:16px 0 0;color:var(--muted);font:12px/1.5 var(--serif)">There is deliberately no monospace token. If the product ever needs one, that is a new token &mdash; not a local font stack.</p>
</body>
</html>
