<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Thirteen steps, transcribed not invented" name="Space scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div class="row" style="align-items:flex-end;gap:6px">
<div style="text-align:center"><div style="width:4px;height:4px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">4</p></div><div style="text-align:center"><div style="width:6px;height:6px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">6</p></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">8</p></div><div style="text-align:center"><div style="width:10px;height:10px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">10</p></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">12</p></div><div style="text-align:center"><div style="width:14px;height:14px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">14</p></div><div style="text-align:center"><div style="width:18px;height:18px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">18</p></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">20</p></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">24</p></div><div style="text-align:center"><div style="width:28px;height:28px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">28</p></div><div style="text-align:center"><div style="width:34px;height:34px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">34</p></div><div style="text-align:center"><div style="width:44px;height:44px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">44</p></div><div style="text-align:center"><div style="width:68px;height:68px;background:var(--gold);opacity:.65"></div><p style="margin:5px 0 0;color:#797f7a;font:8px var(--sans)">68</p></div></div>
<p style="margin:14px 0 0;color:var(--muted);font:12px/1.5 var(--serif)">Not a 4/8 grid. These are the real values in the stylesheet &mdash; don't snap them.</p>
</body>
</html>
