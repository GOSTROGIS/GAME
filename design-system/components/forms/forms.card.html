<!-- @dsCard group="Components" viewport="700x360" name="Forms" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_fallback.js"></script>
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo-src">
const { StepDots, FieldLabel, TextField, SelectBox, OptionCard, Swatch, AttributeRow, StatStepper, MorphRow } = window.HollowMarch;

function Demo(){
  const [sel,setSel] = React.useState('gloam');
  const [v,setV] = React.useState(12);
  const [m,setM] = React.useState(0.4);
  const [c,setC] = React.useState('#6b5847');
  return (
    <div style={{display:'grid',gap:14}}>
      <StepDots count={6} active={2}/>
      <div className="grid2">
        <div>
          <FieldLabel style={{margin:'0 0 8px'}}>Pilgrim's Name</FieldLabel>
          <TextField value="Aszelin" onChange={()=>{}}/>
        </div>
        <div>
          <FieldLabel style={{margin:'0 0 8px'}}>Hair</FieldLabel>
          <SelectBox options={['Cropped','Shorn','Bound']} onChange={()=>{}}/>
        </div>
      </div>
      <div className="grid2">
        <OptionCard selected={sel==='gloam'} onClick={()=>setSel('gloam')} title="Gloamfarer"
          description="You walked the dark roads before they had names." note="+2 WAYFARING"/>
        <OptionCard selected={sel==='mire'} onClick={()=>setSel('mire')} title="Mire-Physicker"
          description="You treated the drowned parish through three floods." note="+2 ALCHEMY"/>
      </div>
      <div className="row">
        {['#6b5847','#3f4a44','#8d7f6a','#2b2f33'].map(x=>
          <Swatch key={x} color={x} label={x} selected={c===x} onClick={()=>setC(x)}/>)}
      </div>
      <AttributeRow abbr="VIG" name="Vigor" description="Raises health and resistance to bleed.">
        <StatStepper value={v} min={8} max={20} onChange={setV}/>
      </AttributeRow>
      <MorphRow id="cheek" label="Cheek hollow" value={m} onChange={setM}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
/* Babel's type="text/babel" auto-runner does not execute in every host, so the
   demo source above is transformed and run explicitly. */
window.HollowMarchReady.then(function () {
  try {
    var src = document.getElementById("demo-src").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    new Function("React", "ReactDOM", out)(React, ReactDOM);
  } catch (err) {
    console.error("[card] " + err.message);
    document.getElementById("root").textContent = "Card failed: " + err.message;
  }
});
</script>
</body>
</html>
