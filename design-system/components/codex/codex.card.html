<!-- @dsCard group="Components" viewport="700x400" name="Codex" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_fallback.js"></script>
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo-src">
const { EnemyCodexCard, CharacterCodexCard, FactionCard, FamilyStripItem, JournalEntry, RelationshipRow, WorldCard } = window.HollowMarch;

function Demo(){
  const { StatusPill, LockedLore } = window.HollowMarch;
  return (
    <div style={{display:'grid',gap:12}}>
      <div className="grid2">
        <EnemyCodexCard rank="Elite &middot; Controller" region="Dunmire Causeway" name="Parish Drowner"
          description="Waterlogged tissue, collapsed sinuses, and a gait that favours the flooded side."
          facts={[{term:'Family',value:'Drowned'},{term:'Role',value:'Controller'}]}>
          <div className="row" style={{gap:5,margin:'7px 0'}}>
            <StatusPill>Authored</StatusPill><StatusPill tone="valid">Habitat valid</StatusPill><StatusPill tone="prototype">Prototype</StatusPill>
          </div>
          <LockedLore>Codex reveal 2 of 4 locked</LockedLore>
        </EnemyCodexCard>
        <CharacterCodexCard role="Vessel-Keeper" faction="Ember Ledger" name="Ossaline"
          voice="&ldquo;The bells will keep it either way.&rdquo;"
          description="Keeps the Hold's ledger of debts and names.">
          <StatusPill tone="valid">Placed in slice</StatusPill>
        </CharacterCodexCard>
      </div>
      <div className="grid3">
        <FactionCard label="Hearthmere Hold" name="The Ember Ledger" description="Keepers of debt, name and warmth." note="Wary since the causeway."/>
        <FamilyStripItem name="Drowned" count="11 creatures" description="Parish dead that the water kept."/>
        <JournalEntry title="The Unquenched Blade" status="Active" summary="Orik's debt is still unforged."/>
      </div>
      <RelationshipRow from="Ossaline" kind="owes" to="Orik" description="A debt entered in the ledger before the flood."/>
      <WorldCard image="../../../assets/world/dunmire-causeway.png" alt="Dunmire Causeway"
        label="Levels 5&ndash;14 &middot; Gathering" name="Dunmire Causeway"
        description="The drowned parish. Ranged pressure and the moral side story."/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
/* Babel's type="text/babel" auto-runner does not execute in every host, so the
   demo source above is transformed and run explicitly. */
window.HollowMarchReady.then(function () {
  try {
    var src = document.getElementById("demo-src").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    new Function("React", "ReactDOM", out)(React, ReactDOM);
  } catch (err) {
    console.error("[card] " + err.message);
    document.getElementById("root").textContent = "Card failed: " + err.message;
  }
});
</script>
</body>
</html>
