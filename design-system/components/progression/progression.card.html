<!-- @dsCard group="Components" viewport="700x340" name="Progression" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_fallback.js"></script>
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo-src">
const { SkillTile, TechniqueSummary, TechniqueNode, MasteryCard, ActionCodexEntry } = window.HollowMarch;

function Demo(){
  return (
    <div style={{display:'grid',gap:12}}>
      <div className="grid3">
        <SkillTile name="Swordsmanship" level={38} icon="swordsmanship" xpPct={44}/>
        <SkillTile name="Smithing" level={41} icon="smithing" xpPct={62}/>
        <SkillTile name="Wayfaring" level={27} icon="wayfaring" xpPct={18}/>
      </div>
      <TechniqueSummary icon="swordsmanship" level={38} tier="Adept"
        description="Swordsmanship records what you have actually swung, not what you carry."/>
      <div className="grid3">
        <TechniqueNode tier="Adept &middot; learned" name="Measured Draw" state="learned"
          description="Holding a shot past its window trades speed for penetration."/>
        <TechniqueNode tier="Adept &middot; available" name="Bell-Struck Guard" state="available" cost="1 point"
          description="Mutually exclusive with Measured Draw."/>
        <TechniqueNode tier="Master" name="The Long Vigil" state="locked"
          description="Requires level 75 and the mastery trial."/>
      </div>
      <div className="grid2">
        <MasteryCard label="Mastery trial &middot; Level 90" name="The Long Vigil"
          description="Hold the Abbey nave through a full night without drinking."/>
        <div className="grid2" style={{alignContent:'start'}}>
          <ActionCodexEntry name="Quench a blade" kind="Craft" detail="Decays on repetition."/>
          <ActionCodexEntry name="Cut ironbark" kind="Gather" detail="Rested charges apply."/>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
/* Babel's type="text/babel" auto-runner does not execute in every host, so the
   demo source above is transformed and run explicitly. */
window.HollowMarchReady.then(function () {
  try {
    var src = document.getElementById("demo-src").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    new Function("React", "ReactDOM", out)(React, ReactDOM);
  } catch (err) {
    console.error("[card] " + err.message);
    document.getElementById("root").textContent = "Card failed: " + err.message;
  }
});
</script>
</body>
</html>
