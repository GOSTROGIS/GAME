<!-- @dsCard group="Components" viewport="700x260" name="Surfaces & texture" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_fallback.js"></script>
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo-src">
const { GlassPanel, Grain, Vignette, BudgetBar } = window.HollowMarch;

function Demo(){
  return (
    <div className="grid3" style={{height:220}}>
      <GlassPanel style={{padding:14}}>
        <p className="cap">GlassPanel</p>
        <p style={{margin:0,font:'13px/1.4 var(--serif)',color:'#9fa59f'}}>The default raised surface. Every HUD card is one.</p>
      </GlassPanel>
      <div style={{position:'relative',border:'1px solid var(--line)',background:'var(--world-canvas)'}}>
        <Grain/><Vignette/>
        <p className="cap" style={{position:'absolute',left:10,bottom:8,zIndex:5}}>Grain + Vignette</p>
      </div>
      <div style={{display:'grid',gap:8}}>
        <BudgetBar style={{position:'static',margin:0}}>7 of 12 assigned</BudgetBar>
        <div style={{padding:12,background:'var(--modal-bg)',border:'1px solid rgba(216,208,189,.22)',boxShadow:'var(--shadow-modal)'}}>
          <p className="cap" style={{margin:0}}>Modal fill</p>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
/* Babel's type="text/babel" auto-runner does not execute in every host, so the
   demo source above is transformed and run explicitly. */
window.HollowMarchReady.then(function () {
  try {
    var src = document.getElementById("demo-src").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    new Function("React", "ReactDOM", out)(React, ReactDOM);
  } catch (err) {
    console.error("[card] " + err.message);
    document.getElementById("root").textContent = "Card failed: " + err.message;
  }
});
</script>
</body>
</html>
