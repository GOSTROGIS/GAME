<!-- @dsCard group="Components" viewport="700x150" name="Meters" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_fallback.js"></script>
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans)}
  body{padding:18px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
  .cap{color:#797f7a;font:9px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo-src">
const { Meter } = window.HollowMarch;

function Demo(){
  return (
    <div className="grid2">
      <div>
        <p className="cap">Player &mdash; health 10px, others 7px</p>
        <Meter kind="health" value={72} max={100}/>
        <Meter kind="stamina" value={48} max={100}/>
        <Meter kind="focus" value={86} max={100}/>
      </div>
      <div>
        <p className="cap">Enemy &mdash; flat, no gradient</p>
        <Meter kind="enemy" value={340} max={520}/>
        <div style={{marginTop:10}}><Meter kind="health" value={18} max={100} label="CRITICAL"/></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
/* Babel's type="text/babel" auto-runner does not execute in every host, so the
   demo source above is transformed and run explicitly. */
window.HollowMarchReady.then(function () {
  try {
    var src = document.getElementById("demo-src").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    new Function("React", "ReactDOM", out)(React, ReactDOM);
  } catch (err) {
    console.error("[card] " + err.message);
    document.getElementById("root").textContent = "Card failed: " + err.message;
  }
});
</script>
</body>
</html>
