services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hearthmere
      POSTGRES_USER: hearthmere
      POSTGRES_PASSWORD: development-only
    volumes:
      - hearthmere-postgres:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearthmere -d hearthmere"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hearthmere-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    build:
      context: .
      dockerfile: infra/Dockerfile.server
    env_file: infra/.env.example
    ports: ["2567:2567"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2567/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  hearthmere-postgres:
  hearthmere-redis:
